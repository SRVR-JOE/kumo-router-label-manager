name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Type check with mypy
        run: mypy src/ --ignore-missing-imports
        # NOTE: continue-on-error keeps this non-blocking while mypy debt is resolved.
        # disallow_untyped_defs = true in pyproject.toml requires this for now.
        # Error count could not be determined locally (mypy not available without pip install).
        continue-on-error: true

      - name: Run tests with coverage
        run: pytest --cov=src --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  electron:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

  powershell:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer on root PowerShell scripts
        # Error-only severity: non-blocking to avoid immediate CI breakage on production scripts
        # that currently have zero validation. This provides useful feedback without blocking.
        run: |
          $ErrorActionPreference = 'Continue'
          Get-ChildItem -Path . | Where-Object { $_.Extension -in @('.ps1', '.psm1') } | ForEach-Object {
            Write-Host "Analyzing: $($_.Name)"
            Invoke-ScriptAnalyzer -Path $_.FullName -Severity Error
          }
        shell: pwsh
