name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Type check with mypy
        run: mypy src/ --ignore-missing-imports
        # NOTE: continue-on-error keeps this non-blocking while mypy debt is resolved.
        # disallow_untyped_defs = true in pyproject.toml requires this for now.
        # Error count could not be determined locally (mypy not available without pip install).
        continue-on-error: true

      - name: Run tests with coverage
        run: pytest --cov=src --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  electron:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

  powershell:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer on root PowerShell scripts
        # Error-only severity: non-blocking to avoid immediate CI breakage on production scripts
        # that currently have zero validation. This provides useful feedback without blocking.
        run: |
          $ErrorActionPreference = 'Continue'
          Get-ChildItem -Path . | Where-Object { $_.Extension -in @('.ps1', '.psm1') } | ForEach-Object {
            Write-Host "Analyzing: $($_.Name)"
            Invoke-ScriptAnalyzer -Path $_.FullName -Severity Error
          }
        shell: pwsh

      # Windows PowerShell 5.1 assumes ANSI for files without a BOM, which mangles
      # non-ASCII characters. U+2713 becomes a smart quote that 5.1 treats as a string
      # delimiter, so the script fails to parse. pwsh (7+) defaults to UTF-8 and does
      # not reproduce this, which is why the analyzer step above never caught it.
      - name: Assert scripts parse under Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = @()
          Get-ChildItem -Path . | Where-Object { $_.Extension -in @('.ps1','.psm1') } | ForEach-Object {
            $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
            $hasBom = ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)
            $hasNonAscii = $false
            foreach ($b in $bytes) { if ($b -gt 127) { $hasNonAscii = $true; break } }
            if ($hasNonAscii -and -not $hasBom) {
              $failed += "$($_.Name): contains non-ASCII but has no UTF-8 BOM"
            }
            $errs = $null; $toks = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$toks, [ref]$errs)
            if ($errs.Count -gt 0) {
              $failed += "$($_.Name): $($errs.Count) parse error(s), first at line $($errs[0].Extent.StartLineNumber)"
            }
          }
          if ($failed.Count -gt 0) {
            $failed | ForEach-Object { Write-Host "FAIL: $_" }
            exit 1
          }
          Write-Host "All PowerShell scripts parse cleanly under $($PSVersionTable.PSVersion)"

      - name: Run PowerShell unit tests
        shell: powershell
        run: |
          $failed = 0
          Get-ChildItem -Path tests/powershell -Filter *.ps1 -File | ForEach-Object {
            Write-Host "Running: $($_.Name)"
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File $_.FullName
            if ($LASTEXITCODE -ne 0) { $failed++ }
          }
          if ($failed -gt 0) { exit 1 }
